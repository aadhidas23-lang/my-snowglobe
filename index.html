<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>aadhi snowglobe</title>
<link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1>aadhi snowglobe</h1>
      <p class="tagline">welcome!! shake for a little winter kindness :)</p>
    </header>
    <main>
      <section class="globe-card">
        <div class="globe" id="globe">
          <img class="scene" src="snowglobe.png" alt="a snowglobe" />
        </div>
        <button id="shake">shake me!!</button>
        <p class="message" id="message">press the button and see what happens :)</p>
      </section>
    </main>
    <footer>
      <p>made by me, with some hot chocolate hehe</p>
    </footer>
  </body>
</html>
